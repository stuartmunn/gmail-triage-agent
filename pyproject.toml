[project]
name = "gmail-triage-agent"
version = "0.1.0"
description = "Agent that triages incoming Gmail: classifies, labels, prioritizes, and acts on messages."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.136,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
