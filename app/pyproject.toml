[project]
name = "gmail-triage-agent"
version = "0.1.0"
description = "Agent that triages incoming Gmail: classifies, labels, prioritizes, and acts on messages."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69,<1",
    "google-api-python-client>=2.100,<3",
    "google-auth>=2.23,<3",
    "google-auth-oauthlib>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gmail_triage_agent*"]

[tool.ruff]
# Pin the target explicitly so results don't depend on where ruff is invoked
# from (inferring it from requires-python only happens when ruff discovers this
# file, which differs between `ruff check app/` at the repo root and
# `ruff check` inside app/). See GTA-13.
target-version = "py312"

[tool.ruff.lint]
# A deliberate, minimal rule set — not ruff's shifting defaults. E4/E7/E9 + F
# are the pyflakes/pycodestyle essentials (E501 line-length intentionally left
# out); I sorts imports; BLE flags blind `except` so the intentional ones must
# carry a `# noqa: BLE001` documenting why. pyupgrade (UP) and comprehension
# (C4) rules are intentionally NOT selected — the codebase uses `Optional[...]`
# by choice, and broadening the rule set is out of scope for GTA-13.
select = ["E4", "E7", "E9", "F", "I", "BLE"]

[tool.ruff.lint.isort]
# Make first-party detection explicit so import ordering is identical whether
# ruff runs from the repo root or from app/.
known-first-party = ["gmail_triage_agent"]
