[project]
name = "gmail-triage-agent"
version = "0.1.0"
description = "Agent that triages incoming Gmail: classifies, labels, prioritizes, and acts on messages."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69,<1",
    "google-api-python-client>=2.100,<3",
    "google-auth>=2.23,<3",
    "google-auth-oauthlib>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gmail_triage_agent*"]
